<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tejiri Anthony — Frontend Engineer</title>
    <meta name="description" content="Lagos-based frontend engineer building responsive websites and web apps with React, TypeScript and Next.js." />
    <meta name="theme-color" content="#f1eee4" />
    <script>
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Netlify Forms detection (the real form is rendered by React) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
